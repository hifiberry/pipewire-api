name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No rust-toolchain.toml and no MSRV pinned in Cargo.toml (just
      # edition = "2021"), so build with whatever is current stable.
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # reqwest is a dev-dependency built with the default (openssl-backed)
      # TLS implementation, so openssl-sys needs the real headers/pkg-config
      # file to link against on Linux. Without this, `cargo test` fails at
      # the openssl-sys build script with "openssl.pc not found".
      - name: Install system build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      # 51 #[test]/#[tokio::test] cases, all pure unit tests (config/param
      # parsing, wpctl/pw-cli output parsing, settings serialization, etc).
      # None of them touch a real PipeWire daemon, so they run unmodified
      # on a bare runner.
      - name: Run Rust tests
        run: cargo test --locked

      - uses: actions/setup-python@v5
        with:
          # HiFiBerryOS is Debian trixie, which ships Python 3.13; match it.
          python-version: "3.13"

      # requirements-test.txt was checked against a clean 3.13 venv and,
      # unlike some sibling packages' requirement files, it lists real PyPI
      # names (pytest, requests) rather than Debian package names, and the
      # test suite imports nothing else beyond the standard library. So it
      # can be used as-is here.
      - name: Install Python test dependencies
        run: pip install -r requirements-test.txt

      # The Python suite (161 cases across 8 files under tests/) drives the
      # API over HTTP: tests/conftest.py builds `pipewire-api` in release
      # mode and starts it against a temporary HOME, then the test files
      # exercise its endpoints with `requests`. That server in turn shells
      # out to wpctl/pw-cli/pw-link/dot, which need a running PipeWire
      # daemon (and, for several endpoints, real ALSA sinks/sources) that
      # a GitHub-hosted runner does not have.
      #
      # Verified locally (clean 3.13 venv, no PipeWire daemon or CLI tools
      # present, matching this runner): running the full suite as-is gives
      # 87 failed / 17 errored, because those code paths return HTTP 500 (no
      # object to answer with) or, for the handful of Python-side helpers
      # that call wpctl directly, raise before pytest can even record a
      # skip. None of that is a self-skip - `pytest.mark.local_only`
      # (already in this suite) marks tests needing *local disk/CLI* access
      # for the local-vs-remote split, not "no PipeWire at all", so it does
      # not help here. Rather than let CI be red on arrival, this step runs
      # the exact subset that was confirmed green:
      #
      #   ignored entirely (every test in the file needs live PipeWire
      #   objects - a real sink/source/device/port/link/module list, or an
      #   actual input-processor node):
      #     - test_input_processor_api.py (0/16 pass without a daemon)
      #     - test_links_api.py           (1/15 pass)
      #     - test_listing_api.py         (2/36 pass)
      #     - test_volume_api.py          (2/36 pass, 17 raise outright)
      #
      #   individually deselected - the rest of their file passes cleanly,
      #   only these need real graph/settings data:
      #     - test_graph_api.py: the four TestGraphDot cases that assert on
      #       actual node/link content in the rendered dot graph (the PNG
      #       and "endpoints exist" tests degrade gracefully and stay in)
      #     - test_settings_api.py: the two TestAutoSave cases that expect
      #       an auto-save triggered by a real settings change coming back
      #       from a live module
      #
      # Everything else runs for real: test_speakereq.py's 26 cases all
      # self-skip cleanly (pytest.skip when the speakereq module/node isn't
      # found), and the remaining tests in test_graph_api.py/
      # test_listing_api.py.../test_settings_api.py/test_volume_api.py that
      # don't need live data pass normally. test_remote.py is a standalone
      # CLI script for testing against a remote server, not a pytest test
      # file - pytest collects 0 items from it, which is expected.
      #
      # Net: 52 of 161 cases actually execute here (24 passed + 28 skipped
      # last verified), the rest are the honestly-labelled subset that
      # needs a real PipeWire daemon and audio hardware to mean anything.
      - name: Run Python tests
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/test_input_processor_api.py \
            --ignore=tests/test_links_api.py \
            --ignore=tests/test_listing_api.py \
            --ignore=tests/test_volume_api.py \
            --deselect tests/test_graph_api.py::TestGraphDot::test_graph_dot_returns_200 \
            --deselect tests/test_graph_api.py::TestGraphDot::test_graph_dot_is_valid_dot \
            --deselect tests/test_graph_api.py::TestGraphDot::test_graph_dot_has_nodes \
            --deselect tests/test_graph_api.py::TestGraphDot::test_graph_dot_has_color_coding \
            --deselect tests/test_settings_api.py::TestAutoSave::test_auto_save_after_setting_change \
            --deselect tests/test_settings_api.py::TestAutoSave::test_auto_save_after_default_reset
